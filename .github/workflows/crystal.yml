name: build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Crystal
        uses: crystal-lang/install-crystal@v1

      - name: Verify
        shell: pwsh
        run: |
          crystal --version
          where.exe crystal

      - name: Build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build | Out-Null
          crystal build --release --no-debug CrystalPotato.cr -o build/CrystalPotato.exe

      - name: Bundle DLLs
        shell: pwsh
        run: |
          $binDir = Split-Path (Get-Command crystal).Source -Parent
          Write-Host "bin=$binDir"
          Get-ChildItem "$binDir\*.dll" -ErrorAction SilentlyContinue |
            Copy-Item -Destination build\ -ErrorAction SilentlyContinue
          Get-ChildItem build\

      - uses: actions/upload-artifact@v4
        with:
          name: CrystalPotato-x64
          path: build/
          if-no-files-found: error
