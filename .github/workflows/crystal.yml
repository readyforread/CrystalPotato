name: build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Crystal
        shell: pwsh
        run: |
          $release = Invoke-RestMethod https://api.github.com/repos/crystal-lang/crystal/releases/latest
          $asset = $release.assets |
            Where-Object { $_.name -like '*windows*x86_64*.zip' -and $_.name -notlike '*symbols*' -and $_.name -notlike '*debug*' } |
            Select-Object -First 1
          if (-not $asset) { Write-Error "no windows asset"; exit 1 }
          Write-Host "Downloading $($asset.name)"
          Invoke-WebRequest $asset.browser_download_url -OutFile crystal.zip
          Expand-Archive crystal.zip -DestinationPath crystal -Force

          $crystalExe = Get-ChildItem -Recurse crystal -Filter crystal.exe | Select-Object -First 1
          if (-not $crystalExe) { Write-Error "crystal.exe not found"; exit 1 }
          $binDir = $crystalExe.DirectoryName
          Write-Host "Crystal bin: $binDir"
          Add-Content $env:GITHUB_PATH $binDir
          Add-Content $env:GITHUB_ENV "CRYSTAL_BIN=$binDir"

      - name: Crystal version
        shell: pwsh
        run: crystal --version

      - name: Build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build | Out-Null
          crystal build --release --no-debug CrystalPotato.cr -o build/CrystalPotato.exe

      - name: Copy runtime DLLs
        shell: pwsh
        run: |
          $binDir = $env:CRYSTAL_BIN
          Copy-Item "$binDir\libgc.dll" build\ -ErrorAction SilentlyContinue
          Copy-Item "$binDir\libpcre2-8.dll" build\ -ErrorAction SilentlyContinue
          Copy-Item "$binDir\*.dll" build\ -ErrorAction SilentlyContinue
          Get-ChildItem build\

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: CrystalPotato-x64
          path: build/
          if-no-files-found: error
          retention-days: 30
